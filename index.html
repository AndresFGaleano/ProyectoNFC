<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirigiendo...</title>
</head>
<body>
  <p id="msg">Redirigiendo...</p>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    fetch("destinos.json", { cache: "no-store" })
      .then(r => r.json())
      .then(d => {
        const url = d[id];
        if (url && /^https?:\/\//.test(url)) {
          location.replace(url);
        } else {
          document.getElementById("msg").textContent = "Enlace no encontrado.";
        }
      })
      .catch(() => {
        document.getElementById("msg").textContent = "Error al cargar.";
      });
  </script>
</body>
</html>
